why:
  title: Pourquoi cette appli existe
  paragraphs:
    - L'actualité de l'IA va vite. On peut croire que tout le monde a déjà tout compris. Ce n'est pas le cas.
    - La plupart des gens débutent. Beaucoup ont essayé un outil de chat une ou deux fois. C'est tout à fait normal.
    - Vous n'avez pas besoin de tout apprendre. Quelques idées claires et un peu de pratique suffisent.
    - Cette appli vous les apporte en leçons courtes. Chacune prend cinq à dix minutes.
    - Nous serons honnêtes avec vous. L'IA est utile pour certaines choses et peu douée pour d'autres. Nous vous montrerons les deux.
    - Ici, pas de score ni de série à tenir. Avancez à votre rythme. Y a pas le feu.

# Le plan « 30 prochains jours » (leçon 8 et onglet Moi). Chaque étape doit rester petite.
plan:
  title: Mes 30 prochains jours
  intro: Une petite étape par semaine. Il n'y a pas de date limite, et vous pouvez changer l'ordre.
  steps:
    - id: week-1
      title: "Semaine 1 : une petite tâche"
      text: Utilisez l'IA pour résumer un long e-mail ou un document.
    - id: week-2
      title: "Semaine 2 : un meilleur prompt"
      text: Servez-vous du générateur de prompt pour une vraie demande.
    - id: week-3
      title: "Semaine 3 : un réglage"
      text: Écrivez trois lignes d'instructions personnalisées dans votre outil d'IA.
    - id: week-4
      title: "Semaine 4 : un partage"
      text: Montrez à un collègue un prompt qui a bien marché pour vous.
  done: Vous avez fait les quatre étapes. Continuez à votre rythme.

# Comment placer l'appli sur l'écran d'accueil. Affiché dans le navigateur, et dans l'onglet Moi.
install:
  title: Installer l'appli
  intro: Placez l'appli sur votre écran d'accueil. Elle s'ouvre en plein écran et fonctionne sans connexion.
  cardTitle: Ajoutez cette appli à votre téléphone
  cardText: Cela prend dix secondes. Vous obtenez une icône sur l'écran d'accueil, et l'appli fonctionne hors ligne.
  showSteps: Voir comment faire
  installNow: Installer maintenant
  dismiss: Plus tard
  ios:
    title: Sur iPhone ou iPad
    steps:
      - Ouvrez cette page dans Safari.
      - Touchez le bouton Partager. C'est un carré avec une flèche vers le haut.
      - Faites défiler vers le bas et touchez « Sur l'écran d'accueil ».
      - Touchez « Ajouter ».
  android:
    title: Sur Android
    steps:
      - Ouvrez cette page dans Chrome.
      - Touchez les trois points en haut à droite.
      - Touchez « Installer l'application » ou « Ajouter à l'écran d'accueil ».
      - Touchez « Installer ».
  desktop:
    title: Sur un ordinateur
    text: Dans Chrome ou Edge, cherchez l'icône d'installation à droite de la barre d'adresse. Cette appli est conçue pour le téléphone, mais elle fonctionne aussi sur ordinateur.
  note: Après l'installation, ouvrez l'appli une fois en étant connecté. Ensuite, elle fonctionne sans connexion.
  installed: L'appli est déjà installée sur cet appareil.
